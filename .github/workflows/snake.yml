# Generates the contribution snake animation used at the bottom of the profile README.
#
# INSTALL PATH (must be exact):
#   .github/workflows/snake.yml   inside the marvindookharan/marvindookharan repo
#
# The job writes the SVGs to a branch named `output`, which the README reads via
# raw.githubusercontent.com. Do not commit the SVGs to main yourself — the action
# manages that branch.

name: Generate snake animation

on:
  # rebuild once a day so the snake reflects recent contributions
  schedule:
    - cron: "0 */24 * * *"

  # lets you trigger it by hand from the Actions tab
  workflow_dispatch:

  # rebuild whenever main changes
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
